<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тестовый сайт — GitHub Pages</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1e3a8a 0%, #6d28d9 50%, #db2777 100%);
    color: #fff;
    text-align: center;
    padding: 24px;
  }
  .card {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 24px;
    padding: 56px 40px;
    max-width: 560px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.3);
  }
  h1 { font-size: 2.2rem; margin-bottom: 16px; }
  p { font-size: 1.1rem; line-height: 1.7; opacity: 0.92; }
  .badge {
    display: inline-block;
    margin-top: 28px;
    padding: 10px 22px;
    border-radius: 999px;
    background: rgba(255,255,255,0.18);
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .emoji { font-size: 3rem; display: block; margin-bottom: 16px; }
</style>
</head>
<body>
  <div class="card">
    <span class="emoji">🚀</span>
    <h1>Сайт работает!</h1>
    <p>Это тестовая страница, подготовленная ИИ-агентом и опубликованная через <strong>GitHub Pages</strong>.</p>
    <div class="badge">✅ Публикация успешна</div>
  </div>
</body>
</html>
